<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Above the Clouds — Scroll to Fly | GSAP Window Zoom</title>
    <meta
      name="description"
      content="GSAP ScrollTrigger plane-window zoom inspired by jeskojets.com — cabin (main.webp) with transparent window, sky (sky.webp) behind."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Inter+Tight:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <div class="progress"><span id="progressBar"></span></div>

    <nav>
      <div class="brand">AERIS<small>Private Aviation</small></div>
      <div style="font-size: 11px; letter-spacing: 0.24em">
        ✈ 5000+ MISSIONS
      </div>
    </nav>

    <!-- THE window label: fixed so it can travel from the window to the top
         header on scroll and stay there. Click = back home. -->
    <a href="#flight" id="windowBrand" class="h-window-brand">Jesko Jets</a>

    <!-- ============ PINNED ZOOM ============ -->
    <section id="flight">
      <div class="stage" id="stage">
        <!-- SKY: behind everything -->
        <div class="layer sky" id="skyLayer">
          <div class="sky-photo" id="skyPhotoWrap">
            <img id="skyPhoto" src="imgs/sky.webp" alt="Sky above the clouds" />
            <!-- cloud band: 2 copies for a seamless right-to-left marquee -->
            <div class="drift drift-single" id="driftSingle">
              <img src="imgs/moving.webp" alt="" /><img
                src="imgs/moving.webp"
                alt=""
                aria-hidden="true"
              />
            </div>
          </div>
        </div>

        <!-- CABIN: main.webp + text glued together. The copy lives INSIDE
         #cabinLayer so the single GSAP cabin zoom carries image + text as one. -->
        <div class="layer cabin" id="cabinLayer">
          <img
            id="cabinImg"
            src="imgs/main.webp"
            alt="Airplane cabin window"
            fetchpriority="high"
            decoding="async"
          />
          <div class="copy">
            <div class="hero-copy" id="heroCopy">
              <h1 class="h-line h-left h-top">We are<br />movement</h1>
              <h1 class="h-line h-right h-mid">We are<br />distinction</h1>

              <div class="h-bottom-left" id="heroBottomLeft">
                <h2 class="h-sub">Your<br />freedom to<br />enjoy life</h2>
                <span class="h-rule"></span>
                <p id="heroPara">
                  Every flight is designed around your comfort,<br />time, and
                  ambitions — so you can focus on<br />what truly matters, while
                  we take care of<br />everything else.
                </p>
              </div>

              <div class="h-bottom-center" id="bookRow">
                <button class="book-btn" type="button">Book the Flight</button>
                <span class="book-plane" aria-hidden="true">✈</span>
              </div>

              <div class="h-bottom-right" id="journeyRow">
                <span class="scroll-down"><i>∨</i>SCROLL DOWN</span>
                <span class="start-journey">TO START THE JOURNEY</span>
              </div>
            </div>
          </div>
        </div>

        <div class="vignette"></div>
        <div class="grain"></div>
        <div class="sky-fade" id="skyFade"></div>
      </div>
</section>

<!-- ============ SKY EXTENSION (empty, same sky colour, extends downward) ============ -->
<section class="sky-extend">
  <img src="imgs/second.webp" alt="Above the clouds" />
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
    <script src="app.js?v=4"></script>
  </body>
</html>
